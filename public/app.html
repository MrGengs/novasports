<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>NovaSport — Aplikasi</title>
<meta name="description" content="Aplikasi NovaSport — simulator panahan, analitik biomekanika, dan manajemen pembinaan atlet." />
<meta name="theme-color" content="#0c1430" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%233b65f2'/%3E%3Ctext x='50' y='68' font-size='62' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/css/base.css" />
<link rel="stylesheet" href="/assets/css/app.css" />
<link rel="stylesheet" href="/assets/css/glass.css" />
<style>
  /* Initial boot loader */
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 999; }
  #boot .logo-mark { width: 54px; height: 54px; font-size: 1.5rem; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.9); opacity: .7; } }
  #app:not(:empty) + #boot { display: none; }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="boot"><span class="logo-mark">N</span></div>
  <script type="module" src="/assets/js/app.js"></script>
  <noscript style="display:block;padding:40px;text-align:center;font-family:sans-serif">NovaSport memerlukan JavaScript aktif untuk berjalan.</noscript>
</body>
</html>
